[project]
name = "bgg-search"
version = "0.5.0"
description = "Python client and CLI for the BoardGameGeek XML API"
readme = "README.md"
license = "MIT"  # SPDX expression (PEP 639)
requires-python = ">=3.13"
authors = [
    { name = "Arnauld Van Muysewinkel", email = "arnauldvm@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
bgg-search = "bgg_search.cli:main"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements/runtime.in"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
locked = ["requirements/runtime.txt"]

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"
