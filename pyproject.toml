[project]
name = "bgg-search"
version = "0.1.0.dev0"
description = "Python client and CLI for the BoardGameGeek XML API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Arnauld Van Muysewinkel", email = "arnauldvm@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
