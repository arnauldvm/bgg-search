[tox]
requires = tox~=4.55.0
env_list = lint,type,security,unit

[testenv:lint]
package = skip
deps = -r requirements/dev.txt
commands =
    ruff check src/ tests/
    ruff format --check --diff src/ tests/

[testenv:type]
package = editable
extras = locked
deps = -r requirements/dev.txt
commands =
    mypy src/ tests/

[testenv:security]
package = skip
deps = -r requirements/dev.txt
commands =
    bandit -c .bandit -r src/

[testenv:unit]
package = editable
extras = locked
deps = -r requirements/unit.txt
commands =
    pytest --cov --cov-report=term-missing tests/unit/

[testenv:integ]
package = editable
extras = locked
passenv = BGG_TOKEN
deps = -r requirements/integ.txt
commands =
    pytest tests/integ/

[testenv:audit]
package = skip
deps = -r requirements/audit.txt
commands =
    pip-audit -r requirements/runtime.txt

[testenv:release]
package = skip
passenv = BGG_TOKEN
deps = -r requirements/release.txt
commands =
    python {toxinidir}/scripts/release.py

[testenv:lock]
package = skip
deps = uv
commands =
    uv pip compile requirements/runtime.in -o requirements/runtime.txt --python-version 3.13
    uv pip compile requirements/dev.in -o requirements/dev.txt --python-version 3.13
    uv pip compile requirements/unit.in -o requirements/unit.txt --python-version 3.13
    uv pip compile requirements/integ.in -o requirements/integ.txt --python-version 3.13
    uv pip compile requirements/audit.in -o requirements/audit.txt --python-version 3.13
    uv pip compile requirements/release.in -o requirements/release.txt --python-version 3.13
