repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        language_version: "22.22.3"
  - repo: local
    hooks:
      - id: tox
        name: tox
        entry: .venv/bin/tox
        language: system
        pass_filenames: false
        always_run: true
