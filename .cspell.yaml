# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/packages/cspell-types/cspell.schema.json

version: "0.2"
language: en-US

dictionaries:
  - python
  - html
  - xml
  - bash
  - markdown
  - software-terms

words:
  # BGG domain terms
  - boardgame
  - boardgamegeek
  - Catan
  - Siedler
  # BGG XML API attribute names (camelCase compounds from BGG schema)
  - yearpublished
  - minplayers
  - maxplayers
  - minplaytime
  - maxplaytime
  - averageweight
  - sortindex
  # Python / tooling
  - conftest
  - docstrings
  - devrelease
  - integ
  - passenv
  - pdoc
  - stdlib
  # Author
  - Arnauld
  - Muysewinkel

ignorePaths:
  - .git/**
  - .venv/**
  - "**/__pycache__/**"
  - "**/*.egg-info/**"
  - dist/**
  - build/**
  - site/**
  - requirements/**

ignoreRegExpList:
  - "https?://[^\\s]+"
