# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/packages/cspell-types/cspell.schema.json

version: "0.2"
language: en-US

dictionaries:
  - python
  - html
  - xml
  - bash
  - markdown
  - software-terms

words:
  - bgg
  - boardgame
  - boardgamegeek
  - xmlapi
  - httpx
  - pydantic
  - pytest
  - mypy
  - ruff
  - pyproject
  - editable
  - geek
  - conftest
  - stdlib
  - integ
  - Arnauld
  - Muysewinkel
  - pytest-cov
  - Catan
  - Pandemic
  # Python / documentation
  - docstrings
  - pdoc
  - devrelease
  # tox keywords
  - passenv
  # pytest fixtures and hooks
  # (capsys, sessionfinish, exitstatus declared inline in their test files)
  # BGG XML API attribute names
  - yearpublished
  - minplayers
  - maxplayers
  - minplaytime
  - maxplaytime
  - averageweight
  - sortindex
  # BGG game data (German title in test fixtures)
  - Siedler

ignorePaths:
  - .git/**
  - .venv/**
  - "**/__pycache__/**"
  - "**/*.egg-info/**"
  - dist/**
  - build/**
  - site/**

ignoreRegExpList:
  - "https?://[^\\s]+"
